name: Qilin game framework

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '0UsefulExamples/qilin-game-framework/**'
      - '.github/workflows/qilin-game-framework.yml'
      - '!0UsefulExamples/qilin-game-framework/reference/qilin.p8'
  pull_request:
    branches: [main]
    paths:
      - '0UsefulExamples/qilin-game-framework/**'
      - '.github/workflows/qilin-game-framework.yml'

permissions:
  contents: write

concurrency:
  group: qilin-game-framework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-sync-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install preview dependencies
        working-directory: 0UsefulExamples/qilin-game-framework
        run: |
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install -r requirements.txt
          python -c "from importlib.metadata import version; assert tuple(map(int, version('pip').split('.'))) >= (26, 2, 2); assert tuple(map(int, version('certifi').split('.'))) >= (2026, 10, 19)"

      - name: Validate framework
        working-directory: 0UsefulExamples/qilin-game-framework
        run: python -m unittest discover -s tests -v

      - name: Refresh original Qilin reference
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/wslu42/qilin/main/qilin.p8 \
            -o 0UsefulExamples/qilin-game-framework/reference/qilin.p8

          if git diff --quiet -- 0UsefulExamples/qilin-game-framework/reference/qilin.p8; then
            echo 'Original Qilin reference is already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 0UsefulExamples/qilin-game-framework/reference/qilin.p8
          git commit -m 'Sync original Qilin reference [skip ci]'
          git push
